<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - ติดต่อเรา</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>แบบฟอร์มการติดต่อ (Contact Form)</h1>

    <form action="#" method="post" class="contact-form">
        <label for="name">ชื่อ-นามสกุล:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">อีเมล:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="subject">หัวข้อ:</label><br>
        <input type="text" id="subject" name="subject"><br><br>

        <label for="message">ข้อความ:</label><br>
        <textarea id="message" name="message" rows="5" required></textarea><br><br>

        <button type="submit" class="btn">ส่งข้อความ</button>
    </form>

    <br>
    <a href="index.html" class="btn">กลับหน้าหลัก (Index)</a>

    <footer>
        <p><a href="https://github.com/your-username" target="_blank">GitHub Profile</a></p>
    </footer>

</body>
</html>
